[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = []

[functions."*"]
  included_files = ["netlify/lib/**"]

# SPA fallback (functions still take priority for /.netlify/functions/*)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
